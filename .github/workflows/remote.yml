name: Remote firmware
on:
  push:
    paths: ['firmware/remote/**', 'firmware/shared/**', '.github/workflows/remote.yml']
  pull_request:
    paths: ['firmware/remote/**', 'firmware/shared/**', '.github/workflows/remote.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.2.0 esptool==4.8.1
      - run: sh firmware/remote/tests/run.sh
      - run: pio run -d firmware/remote -e c6_remote
      # One image flashable at 0x0 (bootloader, partition table, OTA selector, application),
      # for PCs where the local RISC-V toolchain cannot run.
      - name: Merge flash image
        run: |
          b=firmware/remote/.pio/build/c6_remote
          app0=$(find ~/.platformio/packages -path '*framework-arduinoespressif32*' -name boot_app0.bin | head -1)
          test -n "$app0"
          python -m esptool --chip esp32c6 merge_bin -o $b/c6_remote-merged.bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x0 $b/bootloader.bin 0x8000 $b/partitions.bin 0xe000 "$app0" 0x10000 $b/firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: c6_remote
          path: firmware/remote/.pio/build/c6_remote/c6_remote-merged.bin
          if-no-files-found: error
          retention-days: 30

name: Lane display firmware
on:
  push:
    paths: ['firmware/lane-display/**', 'firmware/shared/**', '.github/workflows/lane-display.yml']
  pull_request:
    paths: ['firmware/lane-display/**', 'firmware/shared/**', '.github/workflows/lane-display.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.2.0
      - run: sh firmware/shared/tests/run.sh
      - run: sh firmware/lane-display/tests/run.sh
      - run: pio run -d firmware/lane-display -e c3_lane1 -e c3_lane2 -e c3_lane3 -e c3_lane4 -e c3_bench

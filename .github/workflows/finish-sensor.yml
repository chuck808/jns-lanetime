name: FN-1 firmware
on:
  push:
    paths: ['firmware/finish-sensor/**', 'firmware/shared/**', 'firmware/controller/include/**', 'firmware/lane-display/include/**', '.github/workflows/finish-sensor.yml']
  pull_request:
    paths: ['firmware/finish-sensor/**', 'firmware/shared/**', 'firmware/controller/include/**', 'firmware/lane-display/include/**', '.github/workflows/finish-sensor.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.2.0
      - run: sh firmware/shared/tests/run.sh
      - run: sh firmware/controller/tests/run.sh
      - run: sh firmware/lane-display/tests/run.sh
      - run: sh firmware/finish-sensor/tests/run.sh
      - run: pio run -d firmware/finish-sensor -e c3_fn1 -e c3_fn1_sync

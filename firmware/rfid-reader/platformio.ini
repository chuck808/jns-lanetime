[platformio]
default_envs = core2_bench

[env:core2_bench]
platform = espressif32@6.10.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
lib_deps =
  m5stack/M5GFX@0.3.0
  m5stack/M5Unified@0.2.8
  https://github.com/kkloesener/MFRC522_I2C.git#8152dddc93cf743397ac225e34bf268698326664
build_flags =
  -DJNS_READER_LANE=1

[platformio]
default_envs = magtag

[env]
platform = espressif32@6.10.0
board = adafruit_magtag29_esp32s2
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit EPD@4.6.14
  adafruit/Adafruit GFX Library@1.12.6
  adafruit/Adafruit BusIO@1.17.4
  adafruit/Adafruit NeoPixel@1.15.2
build_flags =
  -I../shared/include
  -DJNS_SYSTEM_ID=0x4A4E5301
  -DJNS_RADIO_CHANNEL=6

[env:magtag]

[env:magtag_legacy]
build_flags = ${env.build_flags} -DJNS_LEGACY_DISPLAY=1

; Standalone demo with simulated external sensor readiness and NO radio transmission.
[env:magtag_bench]
build_flags = ${env.build_flags} -DJNS_BENCH=1

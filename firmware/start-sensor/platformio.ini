[platformio]
default_envs = c3_st2
[env]
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
  -I../shared/include
  -DJNS_SYSTEM_ID=0x4A4E5301
  -DJNS_RADIO_CHANNEL=6
  -DJNS_IR_TX=4
  -DJNS_IR_RX=5
  -DJNS_ALIGN_LED=3
  -DJNS_SPEAKER=6
[env:c3_st2]
build_flags = ${env.build_flags} -DJNS_LANE=2
[env:c3_st3]
build_flags = ${env.build_flags} -DJNS_LANE=3
[env:c3_st4]
build_flags = ${env.build_flags} -DJNS_LANE=4
; Live-radio input test; countdown sound remains enabled.
[env:c3_st2_sync]
build_flags = ${env.build_flags} -DJNS_LANE=2 -DJNS_SYNC_BENCH=1

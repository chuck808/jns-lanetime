; Bench sync test (specification §5.1, §9). Three M5Stamp-S3s:
;   heartbeat  - stands in for ST-1: v2 Status heartbeats, plus a timed test pulse
;   unit       - flash to two boards: track the timebase, timestamp the pulse
[platformio]
default_envs = unit

[env]
platform = espressif32@6.10.0
; M5Stamp-S3 is an ESP32-S3FN8 (8 MB flash, no PSRAM); the generic S3 board matches it.
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -I../shared/include
  -DJNS_SYSTEM_ID=0x4A4E5301
  -DJNS_RADIO_CHANNEL=6
  ; Test pulse: output on the heartbeat board, input on the units. Must be a plain GPIO
  ; reachable on your carrier; avoid strapping pins 0/3/45/46, USB 19/20 and the Stamp LED 21.
  -DSYNC_PIN=5
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

[env:heartbeat]
build_flags = ${env.build_flags} -DJNS_BENCH_HEARTBEAT=1

[env:unit]

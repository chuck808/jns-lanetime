[platformio]
default_envs = c3_fn1
[env]
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
  -I../shared/include
  -DJNS_SYSTEM_ID=0x4A4E5301
  -DJNS_RADIO_CHANNEL=6
  -DJNS_IR_TX=4
  -DJNS_IR_RX=5
  -DJNS_ALIGN_LED=3
[env:c3_fn1]
; GPIO-only sync bench: same live radio/state machine but no IR drive.
[env:c3_fn1_sync]
build_flags = ${env.build_flags} -DJNS_SYNC_BENCH=1

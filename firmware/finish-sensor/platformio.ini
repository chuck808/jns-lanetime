[platformio]
default_envs = c6_fn1
[env]
framework = arduino
monitor_speed = 115200
build_flags =
  -I../shared/include
  -DJNS_SYSTEM_ID=0x4A4E5301
  -DJNS_RADIO_CHANNEL=6

; ESP32-C3-DevKitM-1 reference board, Arduino-ESP32 2.0.17.
[c3]
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags}
  -DJNS_IR_TX=4
  -DJNS_IR_RX=5
  -DJNS_ALIGN_LED=3

; DFRobot Beetle ESP32-C6 (DFR1117). The C6 needs Arduino-ESP32 3.x, which PlatformIO's own
; espressif32 platform does not provide; pioarduino is the community-maintained platform for it.
; GPIO 4, 5, 8, 9 and 15 are strapping pins and 16/17 carry the boot log, so the optics and
; pixel use 6, 7 and 22. GPIO 15 is the onboard LED; GPIO 0 is the board's battery divider.
[c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = dfrobot_beetle_esp32c6
lib_deps = adafruit/Adafruit NeoPixel@1.15.2
build_flags = ${env.build_flags}
  -DJNS_IR_TX=6
  -DJNS_IR_RX=7
  -DJNS_ALIGN_LED=15
  -DJNS_PIXEL=22
  -DJNS_PIXEL_RGBW=0

[env:c6_fn1]
extends = c6
build_flags = ${c6.build_flags} -DJNS_LANE=1
[env:c6_fn2]
extends = c6
build_flags = ${c6.build_flags} -DJNS_LANE=2
[env:c6_fn3]
extends = c6
build_flags = ${c6.build_flags} -DJNS_LANE=3
[env:c6_fn4]
extends = c6
build_flags = ${c6.build_flags} -DJNS_LANE=4
; Live radio, GPIO input, IR drive disabled.
[env:c6_fn1_sync]
extends = c6
build_flags = ${c6.build_flags} -DJNS_LANE=1 -DJNS_SYNC_BENCH=1

[env:c3_fn1]
extends = c3
build_flags = ${c3.build_flags} -DJNS_LANE=1
[env:c3_fn2]
extends = c3
build_flags = ${c3.build_flags} -DJNS_LANE=2
[env:c3_fn3]
extends = c3
build_flags = ${c3.build_flags} -DJNS_LANE=3
[env:c3_fn4]
extends = c3
build_flags = ${c3.build_flags} -DJNS_LANE=4
; Live radio, GPIO input, IR drive disabled.
[env:c3_fn1_sync]
extends = c3
build_flags = ${c3.build_flags} -DJNS_LANE=1 -DJNS_SYNC_BENCH=1
[env:c3_fn2_sync]
extends = c3
build_flags = ${c3.build_flags} -DJNS_LANE=2 -DJNS_SYNC_BENCH=1

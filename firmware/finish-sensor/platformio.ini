[platformio]
default_envs = c3_fn1
[env]
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
  -I../shared/include
  -DJNS_SYSTEM_ID=0x4A4E5301
  -DJNS_RADIO_CHANNEL=6
  -DJNS_IR_TX=4
  -DJNS_IR_RX=5
  -DJNS_ALIGN_LED=3
[env:c3_fn1]
build_flags = ${env.build_flags} -DJNS_LANE=1
[env:c3_fn2]
build_flags = ${env.build_flags} -DJNS_LANE=2
[env:c3_fn3]
build_flags = ${env.build_flags} -DJNS_LANE=3
[env:c3_fn4]
build_flags = ${env.build_flags} -DJNS_LANE=4
; Live radio, GPIO input, IR drive disabled.
[env:c3_fn1_sync]
build_flags = ${env.build_flags} -DJNS_LANE=1 -DJNS_SYNC_BENCH=1
; Live radio, GPIO input, IR drive disabled.
[env:c3_fn2_sync]
build_flags = ${env.build_flags} -DJNS_LANE=2 -DJNS_SYNC_BENCH=1

; DFRobot Beetle ESP32-C6 Mini (4 MB flash). ESP32-C6 needs Arduino core 3.x (pioarduino).
; Provisional pins, avoiding the C6 strapping pins 4/5/8/9: IR drive GPIO 7, receiver/bench
; input GPIO 6, beam-clear indicator on the on-board LED (GPIO 15). Confirm against the pinout.
[c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-c6-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
  -I../shared/include
  -DJNS_SYSTEM_ID=0x4A4E5301
  -DJNS_RADIO_CHANNEL=6
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DJNS_IR_TX=7
  -DJNS_IR_RX=6
  -DJNS_ALIGN_LED=15
[env:c6_fn1]
extends = c6
build_flags = ${c6.build_flags} -DJNS_LANE=1
[env:c6_fn2]
extends = c6
build_flags = ${c6.build_flags} -DJNS_LANE=2
[env:c6_fn3]
extends = c6
build_flags = ${c6.build_flags} -DJNS_LANE=3
[env:c6_fn4]
extends = c6
build_flags = ${c6.build_flags} -DJNS_LANE=4
; Live radio, GPIO input, IR drive disabled.
[env:c6_fn1_sync]
extends = c6
build_flags = ${c6.build_flags} -DJNS_LANE=1 -DJNS_SYNC_BENCH=1

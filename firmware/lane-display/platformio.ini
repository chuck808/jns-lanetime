[platformio]
default_envs = c3_lane1

[env]
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps = majicdesigns/MD_MAX72XX@3.5.1
build_flags =
  -I../shared/include
  -DJNS_SYSTEM_ID=0x4A4E5301
  -DJNS_RADIO_CHANNEL=6
  -DJNS_MATRIX_DIN=6
  -DJNS_MATRIX_CLK=4
  -DJNS_MATRIX_CS=7
  -DJNS_MATRIX_INTENSITY=4

[env:c3_lane1]
build_flags = ${env.build_flags} -DJNS_LANE=1
[env:c3_lane2]
build_flags = ${env.build_flags} -DJNS_LANE=2
[env:c3_lane3]
build_flags = ${env.build_flags} -DJNS_LANE=3
[env:c3_lane4]
build_flags = ${env.build_flags} -DJNS_LANE=4

; Isolated display/readability demo. Wi-Fi remains off; never publishes or accepts results.
[env:c3_bench]
build_flags = ${env.build_flags} -DJNS_LANE=1 -DJNS_DISPLAY_BENCH=1

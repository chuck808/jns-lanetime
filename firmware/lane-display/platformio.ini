[platformio]
default_envs = c3_lane1

[env]
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps = majicdesigns/MD_MAX72XX@3.5.1
build_flags =
  -I../shared/include
  -DJNS_SYSTEM_ID=0x4A4E5301
  -DJNS_RADIO_CHANNEL=6

[c3]
build_flags =
  ${env.build_flags}
  -DJNS_MATRIX_DIN=6
  -DJNS_MATRIX_CLK=4
  -DJNS_MATRIX_CS=7
  -DJNS_MATRIX_INTENSITY=4

[stamp_s3]
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DJNS_MATRIX_DIN=9
  -DJNS_MATRIX_CLK=5
  -DJNS_MATRIX_CS=7
  -DJNS_MATRIX_INTENSITY=10

[env:c3_lane1]
build_flags = ${c3.build_flags} -DJNS_LANE=1
[env:c3_lane2]
build_flags = ${c3.build_flags} -DJNS_LANE=2
[env:c3_lane3]
build_flags = ${c3.build_flags} -DJNS_LANE=3
[env:c3_lane4]
build_flags = ${c3.build_flags} -DJNS_LANE=4

; Isolated demos: Wi-Fi off; never publish or accept results.
[env:c3_bench]
build_flags = ${c3.build_flags} -DJNS_LANE=1 -DJNS_DISPLAY_BENCH=1

[env:stamp_s3_lane1]
board = m5stack-stamps3
build_flags = ${stamp_s3.build_flags} -DJNS_LANE=1
[env:stamp_s3_lane2]
board = m5stack-stamps3
build_flags = ${stamp_s3.build_flags} -DJNS_LANE=2
[env:stamp_s3_lane3]
board = m5stack-stamps3
build_flags = ${stamp_s3.build_flags} -DJNS_LANE=3
[env:stamp_s3_lane4]
board = m5stack-stamps3
build_flags = ${stamp_s3.build_flags} -DJNS_LANE=4
[env:stamp_s3_bench]
board = m5stack-stamps3
build_flags = ${stamp_s3.build_flags} -DJNS_LANE=1 -DJNS_DISPLAY_BENCH=1

; DFRobot FireBeetle 2 ESP32-C6 (4 MB flash) with an 8x32 WS2812B panel.
; ESP32-C6 needs Arduino core 3.x, so these use the pinned pioarduino platform.
; Panel data on GPIO 6. On-board LED GPIO 15 is lit while synchronised to ST-1.
; Brightness is capped (max 64/255) for supply safety.
[c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-c6-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = default.csv
lib_deps = adafruit/Adafruit NeoPixel@1.15.2
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DJNS_WS2812=1
  -DJNS_MATRIX_DIN=6
  -DJNS_MATRIX_BRIGHTNESS=16
  -DJNS_MATRIX_SERPENTINE=1
  -DJNS_MATRIX_FLIP_X=0
  -DJNS_MATRIX_FLIP_Y=0
  -DJNS_STATUS_LED=15

[env:c6_lane1]
extends = c6
build_flags = ${c6.build_flags} -DJNS_LANE=1
[env:c6_lane2]
extends = c6
build_flags = ${c6.build_flags} -DJNS_LANE=2
[env:c6_lane3]
extends = c6
build_flags = ${c6.build_flags} -DJNS_LANE=3
[env:c6_lane4]
extends = c6
build_flags = ${c6.build_flags} -DJNS_LANE=4
[env:c6_bench]
extends = c6
build_flags = ${c6.build_flags} -DJNS_LANE=1 -DJNS_DISPLAY_BENCH=1

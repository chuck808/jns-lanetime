[platformio]
default_envs = c6_remote
; DFRobot Beetle ESP32-C6 (DFR1117), as FN. The C6 needs Arduino-ESP32 3.x: pioarduino.
[env:c6_remote]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = dfrobot_beetle_esp32c6
framework = arduino
monitor_speed = 115200
lib_deps = adafruit/Adafruit NeoPixel@1.15.2
build_flags =
  -I../shared/include
  -DJNS_SYSTEM_ID=0x4A4E5301
  -DJNS_RADIO_CHANNEL=6
  -DJNS_BTN_GO=6
  -DJNS_BTN_CANCEL=7
  -DJNS_PIXEL=22
  -DJNS_PIXEL_POWER=23
  -DJNS_PIXEL_RGBW=0
